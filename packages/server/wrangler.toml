ESPERA_ENDPOINT_POLICY = "allowlisted-https"
ESPERA_ALLOWED_ENDPOINT_HOSTS = "api.openai.com,api.anthropic.com,generativelanguage.googleapis.com,openrouter.ai,api.deepseek.com,api.groq.com,api.together.xyz,api.fireworks.ai,api.mistral.ai,api.x.ai,api.cerebras.ai,api.siliconflow.com,api.novita.ai,api.perplexity.ai,api.venice.ai,api.z.ai,api.minimax.io"
GITHUB_OAUTH_REDIRECT_URI = "https://project-espera-api.hfainvididual.workers.dev/api/auth/github/callback"
